<!doctype html><html><head><meta charset="utf-8"><title>rider POV rig prototype</title>
<script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/addons/"}}</script>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c"></canvas><pre id="out" style="position:fixed;left:8px;top:8px;color:#8f8;font:12px monospace;margin:0"></pre>
<script type="module">
// Prototype of the first-person RIDER rig used to measure the numbers in the art-direction plan:
// camera on the saddle, neck + horned head centred ahead, wings both sides, gloved hands + reins in the foreground.
// ?tier=phone drops DOF and the 2k maps the way quality.js BUDGET.phone does.
import * as THREE from 'three';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {BokehPass} from 'three/addons/postprocessing/BokehPass.js';
import {FilmPass} from 'three/addons/postprocessing/FilmPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
import {createDragon} from '../dragon.js';
import {wingbeatPose} from '../wingbeat.js';
const q=new URLSearchParams(location.search);const tier=q.get('tier')||'high';const W=innerWidth,H=innerHeight;
const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:tier==='phone'});renderer.setSize(W,H,false);renderer.setPixelRatio(1);
renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=.95;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x9aa7ad,.0016);
const camera=new THREE.PerspectiveCamera(H>W?74:56,W/H,.05,1500);
// ---------- lighting: HDRI for image-based light, one warm sun for shadows + wing backlight ----------
const sun=new THREE.DirectionalLight(0xffd9b0,3.2);sun.position.set(70,48,-130);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:200});sun.shadow.bias=-.0002;sun.shadow.normalBias=.03;sun.shadow.camera.updateProjectionMatrix();scene.add(sun,sun.target);
scene.add(new THREE.HemisphereLight(0xa7b6c4,0x2b2620,.35));
// ---------- stand-in canyon so the exposure / fog / DOF read like the reference ----------
const loader=new THREE.TextureLoader();
const cliffTex=loader.load('../assets/cliff_side_diff_1k.jpg');cliffTex.colorSpace=THREE.SRGBColorSpace;cliffTex.wrapS=cliffTex.wrapT=THREE.RepeatWrapping;cliffTex.repeat.set(6,3);
const cliffNor=loader.load('../assets/cliff_side_nor_gl_1k.jpg');cliffNor.wrapS=cliffNor.wrapT=THREE.RepeatWrapping;cliffNor.repeat.set(6,3);
const cliffMat=new THREE.MeshStandardMaterial({map:cliffTex,normalMap:cliffNor,roughness:.95,color:0x8c7a66});
for(const side of[-1,1]){const wall=new THREE.Mesh(new THREE.PlaneGeometry(900,260,1,1),cliffMat);wall.position.set(side*70,80,-350);wall.rotation.y=-side*Math.PI/2+side*.08;wall.receiveShadow=true;scene.add(wall);}
const water=new THREE.Mesh(new THREE.PlaneGeometry(400,1200),new THREE.MeshPhysicalMaterial({color:0x0a4b52,roughness:.22,metalness:0,clearcoat:1}));water.rotation.x=-Math.PI/2;water.position.set(0,-30,-400);scene.add(water);
// ---------- dragon (existing procedural model; the plan replaces the neck/head with a longer loft) ----------
const model=createDragon(renderer);const dragon=model.dragon;scene.add(dragon);
const S=1.8;dragon.scale.setScalar(S);   // rider scale: head ~9 m ahead of the eye, wingspan ~18 m, like the reference videos
// Swap the skin to the PBR set generated by tools/make-scale-maps.py to measure the material response.
const mapSize=tier==='phone'?'512':'1k';
const albedo=loader.load('../dragon-scales.webp');albedo.colorSpace=THREE.SRGBColorSpace;albedo.wrapS=albedo.wrapT=THREE.RepeatWrapping;
const nor=loader.load('../assets/dragon-scales_nor_gl_'+mapSize+'.jpg');nor.wrapS=nor.wrapT=THREE.RepeatWrapping;
const arm=loader.load('../assets/dragon-scales_arm_'+mapSize+'.jpg');arm.wrapS=arm.wrapT=THREE.RepeatWrapping;
const horn=new THREE.MeshPhysicalMaterial({color:0x2e2a25,roughness:.42,metalness:0,clearcoat:.5,clearcoatRoughness:.3});
// Backlit membrane stand-in: dark warm skin + strong sheen so sun grazing the wing glows at the edges (the plan adds a wrap-light term).
const membraneMat=new THREE.MeshPhysicalMaterial({color:0x4b3b33,roughness:.75,metalness:0,side:THREE.DoubleSide,vertexColors:true,sheen:1,sheenColor:new THREE.Color(0xd98a55),sheenRoughness:.55});
dragon.traverse(m=>{if(!m.isMesh)return;if(!m.material.map){if(m.material.side===THREE.DoubleSide){membraneMat.onBeforeCompile=m.material.onBeforeCompile;m.material=membraneMat;}else if(m.material.emissive.getHex()===0)m.material=horn;return;}if(!m.material.vertexColors){m.material=new THREE.MeshPhysicalMaterial({color:0x3f4a41,map:albedo,normalMap:nor,normalScale:new THREE.Vector2(1,1),roughnessMap:arm,roughness:1,metalness:0,clearcoat:.4,clearcoatRoughness:.4});return;}
{const old=m.material;m.material=new THREE.MeshPhysicalMaterial({color:0x5a6a5c,map:albedo,normalMap:nor,normalScale:new THREE.Vector2(1.2,1.2),roughnessMap:arm,aoMap:arm,roughness:1,metalness:0,clearcoat:.55,clearcoatRoughness:.35,vertexColors:true,sheen:.25,sheenColor:new THREE.Color(0x3d5a4a),sheenRoughness:.6});}});
// ---------- rider foreground: saddle pommel, two gloved hands, rope reins ----------
const leather=new THREE.MeshPhysicalMaterial({color:0x3a2416,roughness:.55,clearcoat:.6,clearcoatRoughness:.4});
const glove=new THREE.MeshPhysicalMaterial({color:0x6b4a2c,roughness:.7,sheen:.5,sheenColor:new THREE.Color(0x8a6a48)});
const rope=new THREE.MeshStandardMaterial({color:0xc85a2a,roughness:.9});
const rig=new THREE.Group();scene.add(rig);              // rig = everything attached to the saddle, follows the dragon with lag
const saddleZ=1.0,saddleY=1.42;   // seat 3 m BEHIND the wing root (z=-1.2*S=-2.16) so the leading edge is ahead of the eye; body top at z=1.0 is y~1.45
const pommel=new THREE.Mesh(new THREE.SphereGeometry(.17,24,16),leather);pommel.scale.set(1.5,.7,1.1);pommel.position.set(0,saddleY+.14,saddleZ-.85);rig.add(pommel);
const seat=new THREE.Mesh(new THREE.SphereGeometry(.5,32,16),leather);seat.scale.set(1.25,.22,1.7);seat.position.set(0,saddleY-.02,saddleZ-.15);rig.add(seat);
const hands=[];
for(const side of[-1,1]){const hand=new THREE.Group();hand.position.set(side*.36,saddleY+.5,saddleZ+.18);rig.add(hand);hands.push(hand);
 const palm=new THREE.Mesh(new THREE.CapsuleGeometry(.09,.14,6,12),glove);palm.rotation.z=side*.5;palm.rotation.x=-.4;hand.add(palm);
 for(let f=0;f<4;f++){const finger=new THREE.Mesh(new THREE.CapsuleGeometry(.03,.12,4,8),glove);finger.position.set(side*(.06-f*.04),-.02,-.09-f*.01);finger.rotation.x=1.5;finger.rotation.z=side*.2;hand.add(finger);}
 const cuff=new THREE.Mesh(new THREE.CylinderGeometry(.075,.1,.3,16),glove);cuff.position.set(side*.06,-.04,.3);cuff.rotation.x=Math.PI/2-.35;hand.add(cuff);
 const reinCurve=new THREE.CatmullRomCurve3([new THREE.Vector3(side*.36,saddleY+.45,saddleZ+.18),new THREE.Vector3(side*.75,saddleY-.05,saddleZ-2.2),new THREE.Vector3(side*.95,1.55,-5.5),new THREE.Vector3(side*.75,1.15,-7.1)]);
 const rein=new THREE.Mesh(new THREE.TubeGeometry(reinCurve,40,.022,8,false),rope);rig.add(rein);
}
rig.traverse(m=>{if(m.isMesh){m.castShadow=true;m.receiveShadow=true;}});
// ---------- camera on the saddle ----------
const eye=new THREE.Vector3(0,saddleY+1.15,saddleZ+.9);   // rider eye: 1.12 m above the seat, 0.95 m behind the seat centre
camera.position.copy(eye);camera.rotation.set(-.24,0,0);   // 11.5 degrees down so neck + hands share the frame
// ---------- post ----------
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(W,H),.28,.7,.9);composer.addPass(bloom);
if(tier==='high'){composer.addPass(new BokehPass(scene,camera,{focus:9,aperture:.0005,maxblur:.006}));}
composer.addPass(new FilmPass(.22,false));composer.addPass(new OutputPass());
const out=document.getElementById('out');
new RGBELoader().load('../assets/kiara_8_sunset_1k.hdr',t=>{t.mapping=THREE.EquirectangularReflectionMapping;const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(t).texture;scene.environmentIntensity=.9;scene.background=t;scene.backgroundBlurriness=.02;pm.dispose();window.__hdr=true;},undefined,e=>{out.textContent='HDR FAIL '+e;});
let phase=0,last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;const time=now/1000;
 const pose=wingbeatPose(phase,0,35);phase+=dt*Math.PI*2*pose.frequency;
 dragon.position.set(0,pose.body*.35*S,0);dragon.rotation.set(-.02,0,Math.sin(time*.6)*.05,'YXZ');model.update(pose,{roll:0},0,0,time);
 // The saddle rig rides the body; the camera adds bob + breathing on top.
 rig.position.copy(dragon.position);rig.rotation.copy(dragon.rotation);
 camera.position.set(eye.x+Math.sin(time*1.3)*.012,eye.y+pose.body*.35*S+Math.sin(time*.9)*.015,eye.z);camera.rotation.set(-.24+Math.sin(time*.7)*.01,0,dragon.rotation.z*.6);
 composer.render();window.__frames=(window.__frames||0)+1;}
requestAnimationFrame(frame);
</script></body></html>
